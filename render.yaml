services:
  - type: web
    name: ExamGoo
    runtime: docker
    plan: starter            # диск доступен только на платных планах
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DB_PATH
        value: /data/app.db
      - key: SETTINGS_PATH
        value: /data/settings.json
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEBAPP_URL
        sync: false          # https://ваш-сервис.onrender.com
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
