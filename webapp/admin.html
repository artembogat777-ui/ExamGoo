<style>
:root{--paper:#f4f6f3;--white:#fff;--ink:#17211d;--muted:#77827c;--line:#e4e9e5;--green:#176b50;--green-soft:#e8f3ed;--red:#bc5548;--red-soft:#fbefed;--amber:#a66d13;--amber-soft:#fbf3e3;--blue:#437c91;--blue-soft:#eaf3f5;--shadow:0 8px 24px rgba(28,51,41,.045;font);--mono:"DM Mono",monospace;--sans:Manrope,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans)}button,input{font:inherit}button{cursor:pointer}#app{min-height:100vh}.shell{min-height:100vh;display:grid;grid-template-columns:236px 1fr}.side{position:sticky;top:0;height:100vh;background:#16251f;color:#dce8e1;padding:25px 16px 18px;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;padding:0 10px 27px}.brand-mark{width:34px;height:34px;background:#91c7aa;color:#133c2e;display:grid;place-items:center;border-radius:9px;font-weight:800;font-size:17px}.brand-name{font-size:14px;font-weight:800;letter-spacing:0}.brand-sub{display:block;color:#8fa198;font-size:10px;letter-spacing:0;margin-top:1px}.nav-label{padding:7px 11px;color:#82968b;font-size:10px;text-transform:uppercase;font-weight:700}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;color:#b6c6bd;border:0;border-radius:7px;text-align:left;background:transparent}.nav button:hover{background:#24372e;color:#fff}.nav button.active{background:#2b4337;color:#fff}.nav-ico{width:18px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;border-top:1px solid #304239;padding:15px 10px 0;color:#a9b8af;font-size:11px}.live-dot{display:inline-block;width:7px;height:7px;background:#73c69b;border-radius:50%;margin-right:7px}.side-bottom button{float:right;color:#9bafa3;background:none;border:0}.main{min-width:0;padding:0 36px 44px}.topbar{height:76px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin-bottom:26px}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink);font-weight:700}.top-actions{display:flex;align-items:center;gap:12px}.local-tag{font-size:11px;color:var(--green);background:var(--green-soft);padding:6px 9px;border-radius:5px}.avatar{width:34px;height:34px;display:grid;place-items:center;background:#d9e7de;color:#25563f;border-radius:50%;font-weight:800}.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin:0 0 22px;gap:14px}.eyebrow{color:var(--green);font-size:10px;text-transform:uppercase;font-weight:800}.page-head h1{margin:3px 0 0;font-size:25px;letter-spacing:0;line-height:1.25}.subline{margin:5px 0 0;color:var(--muted);font-size:12px}.controls{display:flex;align-items:center;gap:8px}.btn{min-height:36px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--white);color:var(--ink);font-weight:700;font-size:12px}.btn:hover{border-color:#b9c9be}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.icon{width:36px;padding:0;font-size:16px}.grid-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.kpi{background:var(--white);border:1px solid var(--line);border-radius:7px;padding:15px 17px;min-height:112px}.kpi-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:600}.kpi-icon{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;color:var(--green);background:var(--green-soft);font-size:14px}.kpi-value{font-size:25px;font-weight:800;line-height:1.15;margin-top:11px;font-variant-numeric:tabular-nums}.kpi-foot{font-size:10px;color:var(--muted);margin-top:4px}.columns{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,.85fr);gap:14px;margin-bottom:14px}.panel{background:var(--white);border:1px solid var(--line);border-radius:7px;min-width:0}.panel-head{padding:15px 17px 11px;display:flex;justify-content:space-between;align-items:center}.panel-title{font-size:13px;font-weight:800}.panel-note{font-size:10px;color:var(--muted);margin-top:2px}.chart-wrap{height:205px;padding:8px 14px 13px}.chart-wrap svg{width:100%;height:100%;overflow:visible}.chart-grid{stroke:#e9eeea;stroke-width:1}.chart-line{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.chart-area{fill:#e9f3ed;opacity:.9}.chart-point{fill:#fff;stroke:var(--green);stroke-width:2}.chart-label{fill:#8c9790;font:9px var(--mono)}.legend{display:flex;gap:14px;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:5px}.subject-list{padding:4px 17px 15px;display:grid;gap:13px}.subject-row{display:grid;grid-template-columns:72px 1fr 48px;gap:9px;align-items:center;font-size:11px}.subject-name{font-weight:700}.track{height:6px;background:#edf0ed;border-radius:5px;overflow:hidden}.track i{display:block;height:100%;border-radius:5px;background:var(--green)}.subject-count{text-align:right;font:10px var(--mono);color:var(--muted)}.lower-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{padding:9px 13px;color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:800;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}td{padding:11px 13px;border-bottom:1px solid #edf0ed;font-size:11px}tbody tr:last-child td{border-bottom:0}.user-cell{display:flex;align-items:center;gap:9px}.mini-avatar{width:28px;height:28px;display:grid;place-items:center;background:#e6efe9;color:#286048;border-radius:50%;font-weight:800;font-size:10px}.user-name{font-weight:700}.user-id{font:9px var(--mono);color:var(--muted)}.mono{font:10px var(--mono)}.status{display:inline-block;padding:4px 7px;border-radius:4px;font-size:9px;font-weight:800}.status.paid{color:var(--green);background:var(--green-soft)}.status.trial{color:var(--amber);background:var(--amber-soft)}.status.expired{color:#747d77;background:#eef0ee}.report-list{padding:0 16px 8px}.report{padding:11px 0;border-top:1px solid var(--line)}.report:first-child{border-top:1px solid var(--line)}.report-top{display:flex;justify-content:space-between;gap:10px;font-size:10px}.report-task{font:10px var(--mono);color:var(--red);font-weight:500}.report-time{color:var(--muted);font-size:9px;white-space:nowrap}.report-note{color:#59655e;font-size:10px;margin:4px 0 0;white-space:normal;overflow-wrap:anywhere}.section-bar{display:flex;gap:8px;align-items:center;margin-bottom:13px}.search{width:min(360px,100%);height:38px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:white;outline:none}.search:focus{border-color:#73a58c;box-shadow:0 0 0 3px #e2f0e7}.table-panel{overflow:hidden}.pagination{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.empty{padding:28px 15px;text-align:center;color:var(--muted);font-size:11px}.error{padding:11px 13px;background:var(--red-soft);color:var(--red);border-radius:6px;font-size:11px}.loading{color:var(--muted);padding:24px;text-align:center;font-size:11px}.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:#e9eeea}.login-box{width:min(420px,100%);background:white;border:1px solid var(--line);border-radius:9px;padding:27px}.login-box h1{font-size:22px;margin:0 0 6px}.login-box p{color:var(--muted);font-size:12px;margin:0 0 20px}.login-box label{display:block;font-size:11px;font-weight:700;margin:0 0 6px}.login-box input{width:100%;height:42px;border:1px solid var(--line);border-radius:6px;padding:0 11px;margin-bottom:12px}.login-foot{margin-top:15px;color:var(--muted);font-size:10px}.mobile-menu{display:none}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 13px}.filter-row select,.filter-row input{height:38px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);font-size:11px}.filter-row input[type=date]{min-width:135px}.filter-row .search{flex:1;min-width:210px}.filter-label{font-size:10px;color:var(--muted);font-weight:700}.detail-cell{max-width:420px;white-space:normal;overflow-wrap:anywhere}.detail-cell b{display:block;margin-bottom:3px}.pagination button:disabled{opacity:.45;cursor:not-allowed}.tag{display:inline-block;padding:3px 6px;border-radius:4px;background:#eff2ef;font-size:9px;color:#526159}.answer-json{font:10px var(--mono);color:#3f6251;white-space:normal;max-width:180px;overflow-wrap:anywhere}.wide-table{min-width:940px}.small-table{min-width:680px}.period-controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.period-controls input{height:34px;width:140px;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:white;font-size:10px}.kpi-detail{display:flex;gap:18px;flex-wrap:wrap;padding:12px 17px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.kpi-detail strong{color:var(--ink)}
.click-row{cursor:pointer}.click-row:hover{background:#f7faf7}.modal-backdrop{position:fixed;inset:0;z-index:10;background:rgba(16,31,23,.48);display:flex;justify-content:flex-end}.drawer{width:min(760px,100%);height:100%;overflow:auto;background:var(--paper);box-shadow:-12px 0 35px rgba(0,0,0,.13)}.drawer-head{position:sticky;top:0;z-index:1;background:rgba(244,246,243,.96);backdrop-filter:blur(12px);padding:17px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.drawer-body{padding:18px 22px}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:14px}.detail-metric{background:#fff;border:1px solid var(--line);border-radius:6px;padding:11px}.detail-metric span{display:block;color:var(--muted);font-size:9px}.detail-metric strong{font-size:17px}.drawer-section{background:#fff;border:1px solid var(--line);border-radius:6px;margin:0 0 11px;overflow:hidden}.drawer-section h3{font-size:12px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}.drawer-section .table-wrap{max-height:260px}.drawer-section table{min-width:520px}.drawer-section td,.drawer-section th{padding:8px 11px}.close-btn{border:0;background:transparent;font-size:20px;color:var(--muted);width:34px;height:34px}.click-row:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
@media(max-width:1050px){.main{padding-left:22px;padding-right:22px}.grid-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.columns,.lower-grid{grid-template-columns:1fr}.subject-list{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.shell{grid-template-columns:1fr}.side{position:fixed;z-index:5;left:0;right:0;top:auto;bottom:0;width:100%;height:auto;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#16251f}.brand,.nav-label,.side-bottom{display:none}.nav{grid-template-columns:repeat(3,1fr);gap:3px}.nav button{min-height:43px;justify-content:center;gap:6px;padding:0 5px;font-size:10px}.nav-ico{width:auto;font-size:14px}.main{padding:0 14px 85px}.topbar{height:57px;margin-bottom:18px}.page-head{align-items:flex-start;flex-direction:column}.page-head h1{font-size:22px}.grid-kpi{gap:8px}.kpi{padding:12px;min-height:100px}.kpi-value{font-size:22px}.columns,.lower-grid{gap:10px}.chart-wrap{height:180px}.subject-list{grid-template-columns:1fr}.hide-mobile{display:none}.local-tag{font-size:9px}.mobile-menu{display:block}.top-actions{gap:7px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.querySelector('#app');
const tokenKey='exam-admin-token';
let token=sessionStorage.getItem(tokenKey)||'',view='overview',page=1,query='',overview=null;
const filters={from:'',to:'',subject:'',status:'all',sort:'last_seen',direction:'desc',verified:'all',type:'',year:'',paymentStatus:'all',examStatus:'all',reportSort:'ts',paymentSort:'ts',examSort:'started',taskSort:'year',otherDirection:'desc'};
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const num=value=>new Intl.NumberFormat('ru-RU').format(Number(value||0));
const dateTime=value=>value?new Date(Number(value)*1000).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Нет данных';
const statusText={paid:'Оплачен',trial:'Пробный',expired:'Завершён'};
async function api(path){const response=await fetch(path,{headers:token?{'X-Admin-Token':token}:{}});if(!response.ok){const error=new Error(response.status===404?'Сервер отклонил доступ. Откройте панель через http://localhost:8000/admin и проверьте настройку ключа.':`Не удалось загрузить данные (HTTP ${response.status}).`);error.status=response.status;throw error}return response.json()}
function renderLogin(message='',attemptedToken=''){
 app.innerHTML=`<main class="login-screen"><form class="login-box" id="login"><div class="brand-mark" style="margin-bottom:17px">E</div><h1>Панель управления</h1><p>Локальная CRM тренажёра Exam</p><label for="token">Ключ доступа</label><input id="token" type="password" autocomplete="current-password" required placeholder="ADMIN_PANEL_TOKEN" value="${esc(attemptedToken)}">${message?`<div class="error" role="alert">${esc(message)}</div>`:''}<button class="btn primary" style="width:100%" type="submit">Открыть панель</button><div class="login-foot">Ключ задаётся в локальном окружении сервера. Не передавайте его третьим лицам.</div></form></main>`;
 document.querySelector('#login').onsubmit=async event=>{event.preventDefault();const submittedToken=document.querySelector('#token').value.trim();token=submittedToken;try{await api('/api/admin/overview');sessionStorage.setItem(tokenKey,token);render()}catch(error){token='';renderLogin(error.message,submittedToken)}};
}
function shell(content,title='Обзор'){
 app.innerHTML=`<div class="shell"><aside class="side"><div class="brand"><div class="brand-mark">E</div><div class="brand-name">EXAM CRM<span class="brand-sub">ПАНЕЛЬ УПРАВЛЕНИЯ</span></div></div><div class="nav-label">Рабочее пространство</div><nav class="nav"><button data-view="overview" class="${view==='overview'?'active':''}"><span class="nav-ico">▦</span>Обзор</button><button data-view="users" class="${view==='users'?'active':''}"><span class="nav-ico">♙</span>Пользователи</button><button data-view="tasks" class="${view==='tasks'?'active':''}"><span class="nav-ico">▤</span>Задания</button><button data-view="exams" class="${view==='exams'?'active':''}"><span class="nav-ico">▣</span>Экзамены</button><button data-view="payments" class="${view==='payments'?'active':''}"><span class="nav-ico">◉</span>Платежи</button><button data-view="reports" class="${view==='reports'?'active':''}"><span class="nav-ico">⚑</span>Жалобы</button></nav><div class="side-bottom"><span class="live-dot"></span>Сервер активен<button id="logout" title="Выйти">Выйти</button></div></aside><main class="main"><header class="topbar"><div class="crumb">Главная <span style="padding:0 7px;color:#b1bbb5">/</span><strong>${title}</strong></div><div class="top-actions"><span class="local-tag">● Локальный доступ</span><span class="avatar">A</span></div></header>${content}</main></div>`;
 document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{view=button.dataset.view;render()});document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem(tokenKey);token='';renderLogin()};
}
function metric(label,value,note,icon){return `<article class="kpi"><div class="kpi-top"><span>${label}</span><span class="kpi-icon">${icon}</span></div><div class="kpi-value">${value}</div><div class="kpi-foot">${note}</div></article>`}
function chart(points){
 const width=700,height=174,left=34,right=12,top=12,bottom=23,values=points.map(point=>point.attempts),max=Math.max(1,...values),innerW=width-left-right,innerH=height-top-bottom;
 const coords=points.map((point,index)=>[left+(points.length<2?innerW/2:index*innerW/(points.length-1)),top+innerH-(point.attempts/max)*innerH]);
 const line=coords.map(([x,y],index)=>`${index?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`).join(' '),area=`${line} L${coords.at(-1)?.[0]||left},${top+innerH} L${coords[0]?.[0]||left},${top+innerH} Z`;
 const grid=[0,.5,1].map(frac=>`<line class="chart-grid" x1="${left}" x2="${width-right}" y1="${top+innerH*frac}" y2="${top+innerH*frac}"/><text class="chart-label" x="2" y="${top+innerH*frac+3}">${Math.round(max*(1-frac))}</text>`).join('');
 const labels=points.filter((_,index)=>index===0||index===points.length-1||index%7===0).map(point=>{const index=points.indexOf(point),x=coords[index][0];return `<text class="chart-label" text-anchor="${index===0?'start':index===points.length-1?'end':'middle'}" x="${x}" y="${height-3}">${esc(point.day.slice(5))}</text>`}).join('');
 return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Попытки за выбранный период">${grid}<path class="chart-area" d="${area}"/><path class="chart-line" d="${line}"/>${coords.filter((_,index)=>index%5===0||index===coords.length-1).map(([x,y])=>`<circle class="chart-point" cx="${x}" cy="${y}" r="3.5"/>`).join('')}${labels}</svg>`;
}
function overviewPage(d){
 const subjects=d.subjects.length?d.subjects.map(subject=>`<div class="subject-row"><span class="subject-name">${esc(subject.subject)}</span><span class="track"><i style="width:${subject.tasks?Math.round(subject.verified/subject.tasks*100):0}%"></i></span><span class="subject-count">${num(subject.verified)}/${num(subject.tasks)}</span></div><div class="report-note" style="margin:-10px 0 0 81px">${num(subject.attempts)} ответов · ${num(subject.active_users)} учеников · точность ${subject.attempts?Math.round(subject.correct/subject.attempts*100):0}%</div>`).join(''):'<div class="empty">Заданий пока нет</div>';
 const recent=d.recent_users.length?d.recent_users.map(user=>`<tr><td><div class="user-cell"><span class="mini-avatar">${esc((user.name||'У').slice(0,1).toUpperCase())}</span><span><span class="user-name">${esc(user.name||'Ученик')}</span><br><span class="user-id">ID ${esc(user.id)}</span></span></div></td><td class="mono">${num(user.attempts)}</td><td>${dateTime(user.last_seen)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">Пока нет активности</td></tr>';
 const reportsPanel=`<section class="panel"><div class="panel-head"><div><div class="panel-title">Последние жалобы</div><div class="panel-note">Ошибки в формулировках и ключах</div></div><button class="btn" data-view="reports">Все жалобы</button></div><div id="recent-reports" class="report-list"><div class="loading">Загрузка…</div></div></section>`;
 const subjectOptions=['rus','math','phys','chem','bio','hist'].map(code=>`<option value="${code}" ${filters.subject===code?'selected':''}>${code}</option>`).join('');
 shell(`<section class="page-head"><div><div class="eyebrow">ЦТ / ЦЭ · LIVE</div><h1>Операционный обзор</h1><p class="subline">Показатели за выбранный период и накопительные итоги платформы</p></div><div class="controls"><span class="subline">Обновлено ${dateTime(d.generated_at)}</span><button class="btn icon" id="refresh" title="Обновить данные">↻</button></div></section><section class="filter-row"><span class="filter-label">ПЕРИОД</span><input type="date" id="overview-from" value="${esc(filters.from)}"><span class="filter-label">—</span><input type="date" id="overview-to" value="${esc(filters.to)}"><button class="btn" id="period30">30 дней</button><button class="btn" id="periodAll">Всё время</button><select id="overview-subject"><option value="">Все предметы</option>${subjectOptions}</select></section><section class="grid-kpi">${metric('Всего учеников',num(d.users),'за всё время','♙')}${metric('Активны за период',num(d.active_period),`${num(d.active_today)} сегодня · ${num(d.active_week)} за неделю`,'◷')}${metric('Ответы за период',num(d.attempts_period),`точность ${d.accuracy_period}% · всего ${num(d.attempts_all)}`,'✓')}${metric('Оплаченные доступы',num(d.paid_users),`${num(d.trial_users)} пробных · ${num(d.expired_users)} истекших`,'₽')}${metric('Всего XP',num(d.lifetime_xp),`средняя серия ${d.average_streak} · рекорд ${d.best_streak} дней`,'⚡')}${metric('Очередь повторения',num(d.errors_open),`${num(d.reinforcement_due)} пора повторить · ${num(d.reinforcement_scheduled)} запланировано`,'↻')}${metric('Диагностики',num(d.diagnostics_finished),`из ${num(d.diagnostics_count)} · средний балл ${d.average_diagnostic_score}`,'◎')}${metric('Жалобы',num(d.pending_reports),`баннеры качества контента`,'⚑')}</section><section class="columns"><article class="panel"><div class="panel-head"><div><div class="panel-title">Учебная активность</div><div class="panel-note">Ответы и уникальные ученики за выбранный период</div></div><div class="legend"><span><i></i>Попытки</span></di async function loadPayments(){const params=new URLSearchParams({q:query,status:filters.paymentStatus,page,sort:filters.paymentSort,direction:filters.otherDirection,from:filters.from,to:filters.to}),data=await api(`/api/admin/payments?${params}`),body=document.querySelector('#payments-body');if(!body)return;document.querySelector('#payment-pagination').textContent=`${num(data.total)} платежей · страница ${page}`;document.querySelector('#prev').disabled=page<=1;document.querySelector('#next').disabled=page*25>=data.total;body.innerHTML=data.payments.map(payment=>`<tr><td class="mono">${esc(payment.charge_id)}</td><td>${esc(payment.name||'Ученик')}<br><span class="user-id">ID ${esc(payment.user_id)}</span></td><td class="mono">${num(payment.stars)} ⭐</td><td>${dateTime(payment.ts)}</td><td>${dateTime(payment.since)}</td><td>${dateTime(payment.until)}</td><td><span class="status ${payment.refunded?'expired':payment.until>Date.now()/1000?'paid':'trial'}">${payment.refunded?'Возврат':payment.until>Date.now()/1000?'Активен':'Завершён'}</span></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Платежи не найдены</td></tr>'}

async function loadExams(){const params=new URLSearchParams({q:query,subject:filters.subject,status:filters.examStatus,page,sort:filters.examSort,direction:filters.otherDirection,from:filters.from,to:filters.to}),data=await api(`/api/admin/exams?${params}`),body=document.querySelector('#exams-body');if(!body)return;document.querySelector('#exam-pagination').textContent=`${num(data.total)} экзаменов · страница ${page}`;document.querySelector('#prev').disabled=page<=1;document.querySelector('#next').disabled=page*25>=data.total;body.innerHTML=data.exams.map(exam=>`<tr><td>${esc(exam.name||'Ученик')}<br><span class="user-id">ID ${esc(exam.user_id)}</span></td><td>${esc(exam.subject)}</td><td>${esc(exam.year)} · №${esc(exam.variant)}</td><td>${dateTime(exam.started)}</td><td><span class="status ${exam.finished?'paid':'trial'}">${exam.finished?'Завершён':'В процессе'}</span></td><td class="mono">${num(exam.saved_answers)} / ${num(exam.total)}</td><td class="mono">${exam.finished?`${num(exam.correct)} / ${num(exam.total)}`:'—'}</td><td class="mono">${exam.finished?`${num(exam.score)} баллов`:'—'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Экзамены не найдены</td></tr>'}
async function tasksPage(){

async function loadTasks(){const params=new URLSearchParams({q:query,subject:filters.subject,verified:filters.verified,task_type:filters.type,year:filters.year,page,sort:filters.taskSort,direction:filters.otherDirection}),data=await api(`/api/admin/tasks?${params}`),body=document.querySelector('#tasks-body');if(!body)return;document.querySelector('#task-pagination').textContent=`${num(data.total)} заданий · страница ${page}`;document.querySelector('#prev').disabled=page<=1;document.querySelector('#next').disabled=page*25>=data.total;body.innerHTML=data.tasks.map(task=>`<tr><td><span class="mono">${esc(task.id)}</span><br><span class="user-id">${esc(task.source||'')}</span></td><td>${esc(task.subject)}<br><span class="user-id">${esc(task.year)} · вариант ${esc(task.variant)} · ${esc(task.num)}</span></td><td><span class="status ${task.verified?'paid':'expired'}">${task.verified?'Проверено':'Черновик'}</span></td><td>${esc(task.topic)}</td><td class="detail-cell">${esc(task.question)}${task.note?`<br><span class="report-note">${esc(task.note)}</span>`:''}</td><td class="detail-cell"><span class="answer-json">${esc(JSON.stringify(task.answer))}</span><div class="report-note">${esc((task.explanation||[]).join(' '))}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Задания не найдены</td></tr>'}
async function render(){
 if(!token){try{await api('/api/admin/overview')}catch{return renderLogin()}}
 app.innerHTML='<div class="loading">Загрузка панели…</div>';
 try{if(view==='overview'){const params=new URLSearchParams({from:filters.from,to:filters.to,subject:filters.subject});overview=await api(`/api/admin/overview?${params}`);overviewPage(overview)}else if(view==='users')await usersPage();else if(view==='reports')await reportsPage();else if(view==='payments')await paymentsPage();else if(view==='exams')await examsPage();else if(view==='tasks')await tasksPage()}
 catch(error){if(token&&app.querySelector('.loading'))renderLogin(error.message)}
}
render();
