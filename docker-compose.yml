services:
  web:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/app.db
      SETTINGS_PATH: /data/settings.json
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data
    restart: unless-stopped

  # Бот запускается отдельно: docker compose --profile bot up -d
  # Нужен файл bot.py в корне проекта (в присланном архиве его не было).
  bot:
    build: .
    profiles: ["bot"]
    env_file: .env
    environment:
      WEBAPP_URL: ${WEBAPP_URL}
    command: ["python", "bot.py"]
    depends_on:
      - web
    restart: unless-stopped

volumes:
  appdata:
